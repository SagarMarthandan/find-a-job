[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "find-a-job"
version = "0.1.0"
description = "Local-first, evidence-grounded job research and resume workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "pypdf==5.5.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "striprtf==0.0.29",
  "reportlab==4.4.1",
  "playwright==1.52.0",
]

[project.scripts]
find-a-job = "find_a_job.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/find_a_job"]
